openapi: 3.1.0
info:
  title: API MID — Puntaje de confianza y calificaciones validadas (Grupo B)
  version: 0.1.0
  description: |
    API MID del **Grupo B — Pasajeros y reputación** del clúster Súbete.
    No es dueña de los datos básicos: aplica reglas de negocio combinando
    llamadas a otras APIs **siempre a través del API Gateway**.

    ## Endpoints

    1. `GET /perfiles/{id}/puntaje` — puntaje de confianza (0–5) e insignia.
    2. `POST /calificaciones/validadas` — califica solo viajes reales y
       completados, validando la reserva con el grupo Reservas.

    Reglas de integración obligatorias del clúster:
    - Cabecera `X-Gateway-Secret` (401 sin ella, salvo `/health`).
    - Formato de error común: `{ "codigo": "...", "mensaje": "...", "detalle": {} }`.
    - 401 del vecino → renueva token y reintenta 1 vez; luego 503.
    - Vecino caído (503/timeout/red) → 503 `<contexto>_no_disponible`.
    - OpenAI Moderation API: modera el comentario; si falla/timeout/agota reintentos
      aplica el plan de degradación (`permitir` → continúa marcado como degradado;
      `503` → 503 `moderacion_no_disponible`). Nunca bloquea la calificación si
      el plan es `permitir`. Nunca expone la API key ni detalles del proveedor.
  contact:
    name: Grupo B — Pasajeros y reputación (Clúster Súbete)
servers:
  - url: http://localhost:3002
    description: Desarrollo local
tags:
  - name: Salud
  - name: Puntaje
  - name: Calificaciones

paths:
  /health:
    get:
      operationId: verificarSalud
      summary: Prueba de humo del servicio
      description: Responde `200` siempre; exenta de la cabecera del gateway.
      tags: [Salud]
      security: []
      responses:
        '200':
          description: Servicio vivo
          content:
            application/json:
              schema:
                type: object
                required: [estado, servicio]
                properties:
                  estado: { type: string, examples: ['ok'] }
                  servicio: { type: string, examples: ['mid-api'] }

  /perfiles/{id}/puntaje:
    parameters:
      - $ref: '#/components/parameters/IdPerfil'
    get:
      operationId: obtenerPuntaje
      summary: Puntaje de confianza e insignia de un perfil
      description: |
        TODO (P-HU3): puntaje 0–5 (promedio ponderado con últimos 30 días
        al doble, menos tasa de cancelación × 2) e insignia. Si el perfil no
        existe → 404; si Reservas no responde → 503 (sin puntaje incompleto).
      tags: [Puntaje]
      security:
        - bearerAuth: []
          cabeceraSecreta: []
      responses:
        '200':
          description: Puntaje del perfil
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '503': { $ref: '#/components/responses/Error503' }

  /calificaciones/validadas:
    post:
      operationId: calificarViajeValidada
      summary: Califica un viaje completado validando contra Reservas
      description: |
        1) reserva existe → si no 404 `reserva_no_encontrada`;
        2) estado `completada` → si no 409 `reserva_no_completada`;
        3) ambos perfiles participantes → si no 403 `no_participante`;
        4) si hay comentario, se modera con OpenAI Moderation API: inapropiado → 400 `comentario_no_permitido`;
           si OpenAI falla, plan de degradación (`permitir` → continúa marcado como degradado; `503` → 503);
        5) crea la calificación en el crud-api → 201.
      tags: [Calificaciones]
      security:
        - bearerAuth: []
          cabeceraSecreta: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reservaId, deId, paraId, estrellas]
              properties:
                reservaId: { type: string, examples: ['res-0001'] }
                deId: { type: string, examples: ['usr-12'] }
                paraId: { type: string, examples: ['usr-05'] }
                estrellas: { type: integer, minimum: 1, maximum: 5, examples: [4] }
                comentario: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Calificación creada
          content:
            application/json:
              schema:
                type: object
                required: [id, reservaId, dePerfilId, paraPerfilId, estrellas]
                properties:
                  id: { type: string }
                  reservaId: { type: string }
                  dePerfilId: { type: string }
                  paraPerfilId: { type: string }
                  estrellas: { type: integer, minimum: 1, maximum: 5 }
                  comentario: { type: string }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '503': { $ref: '#/components/responses/Error503' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT de corta duración emitido por el API Gateway. Alcances: `perfiles:leer`, `reservas:leer`.'
    cabeceraSecreta:
      type: apiKey
      in: header
      name: X-Gateway-Secret
      description: Cabecera que agrega el gateway; obligatoria en rutas de negocio (401 sin ella).

  parameters:
    IdPerfil:
      name: id
      in: path
      required: true
      description: Identificador del perfil
      schema:
        type: string
        examples: ['usr-01']

  schemas:
    ErrorComun:
      type: object
      description: Formato de error común acordado en el clúster Súbete
      required: [codigo, mensaje, detalle]
      properties:
        codigo:
          type: string
          examples: ['reserva_no_completada']
        mensaje:
          type: string
        detalle:
          type: object
          additionalProperties: true

  responses:
    Error400:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorComun' }
    Error401:
      description: Sin cabecera secreta del gateway (`cabecera_gateway_invalida`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorComun' }
    Error403:
      description: Los perfiles no participaron en la reserva (`no_participante`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorComun' }
    Error404:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorComun' }
    Error409:
      description: Conflicto de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorComun' }
    Error503:
      description: Vecino no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorComun' }
